name: CI

# Проверки запускаются при каждом push и при создании/обновлении pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - name: Статический анализ кода (падает при находках уровня MEDIUM и выше)
        run: bandit -r app manage.py -ll -f txt | tee bandit-report.txt
      - name: Сохранить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt

  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Проверка зависимостей на известные уязвимости (PyPI Advisory DB / OSV)
        run: pip-audit -r requirements.txt | tee pip-audit-report.txt
      - name: Сохранить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.txt

  dependency-check:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    # Дополнительный сканер: без NVD API-ключа база скачивается медленно, поэтому
    # он не блокирует pipeline. Ключ можно добавить в Secrets как NVD_API_KEY.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: secure-api
          path: .
          format: HTML
          args: >
            --failOnCVSS 9
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
      - name: Сохранить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports
